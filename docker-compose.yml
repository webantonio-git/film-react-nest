services:
  postgres:
    image: postgres:16-alpine
    container_name: film-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - film-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: film-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - film-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/webantonio-git/film-backend:latest
    container_name: film-backend
    env_file:
      - ./.env
    depends_on:
      - postgres
    networks:
      - film-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/webantonio-git/film-frontend:latest
    container_name: film-frontend
    volumes:
      - frontend-dist:/app/dist
    networks:
      - film-net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/webantonio-git/film-nginx:latest
    container_name: film-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - film-net
    restart: unless-stopped

volumes:
  db-data:
  pgadmin-data:
  frontend-dist:

networks:
  film-net:
    driver: bridge
